<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#0e1430"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Moonvane — Every moth seeks its moon</title><meta name="description" content="A cozy bearing puzzle. Place moons and bats so every moth faces its ghost arrow. 1000 levels, 17 languages."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/icon-180.png"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="app">
<section id="home" class="screen active"><div class="home-wrap"><div class="logo">🦋</div><h1 class="title">MOONVANE</h1><p class="tagline" data-i18n="tagline"></p><p id="homeLevel" class="home-level"></p><div class="gemrow">◆ <span id="homeGems">0</span></div><div class="menu"><button id="btnPlay" class="btn primary" data-i18n="play"></button><button id="btnDailyChallenge" class="btn daily" data-i18n="daily"></button><button id="btnDaily" class="btn gold" data-i18n="daily"></button><button id="btnMissions" class="btn" data-i18n="missions"></button><button id="btnMap" class="btn" data-i18n="map"></button><button id="btnHelp" class="btn" data-i18n="help"></button><button id="btnSettings" class="btn" data-i18n="settings"></button><button id="btnShop" class="btn" data-i18n="shop"></button></div></div></section>
<section id="game" class="screen"><header class="hud"><button id="btnBack" class="icon-btn" aria-label="map">🗺️</button><div class="hud-mid"><div id="hudLevel" class="hud-level"></div><div id="hudChapter" class="hud-chapter"></div></div><div class="hud-gems">◆ <span id="hudGems">0</span></div></header><div class="board-wrap"><canvas id="board"></canvas></div><div id="coach" class="coach"><span id="coachText"></span><button id="coachBtn" class="btn small primary" data-i18n="gotIt"></button></div><div class="statusrow"><span id="hudMoves"></span><span id="hudPar"></span></div><div id="tray" class="tray"></div><div class="controls"><button id="btnUndo" class="btn small" data-i18n="undo"></button><button id="btnReset" class="btn small" data-i18n="reset"></button><button id="btnHint" class="btn small gold"><span data-i18n="hint"></span> <span id="hintCost"></span></button></div></section>
<section id="win" class="screen overlay"><div class="panel win-panel"><div id="chapterBanner" class="chapter-banner"></div><div id="winStars" class="stars"></div><h2 id="winTitle"></h2><p id="winSub" class="muted"></p><div id="winGems" class="gem-reward"></div><button id="btnDouble" class="btn gold" data-i18n="watchAd"></button><button id="btnNext" class="btn primary" data-i18n="next"></button><div class="row"><button id="btnReplay" class="btn small" data-i18n="replay"></button><button id="winMap" class="btn small" data-i18n="map"></button></div></div></section>
<section id="map" class="screen"><header class="hud"><button id="btnMapBack" class="icon-btn">←</button><div id="mapTitle" class="hud-level"></div><span></span></header><div id="mapNav" class="mapnav"></div><div id="mapGrid" class="mapgrid"></div></section>
<section id="missions" class="screen"><header class="hud"><button id="btnMissionsBack" class="icon-btn">←</button><div class="hud-level" data-i18n="missions"></div><span></span></header><div class="panel missions-panel"><div id="missionsList"></div><h3 class="stats-title" data-i18n="stats"></h3><div id="statsBox" class="statsbox"></div></div></section>
<section id="settings" class="screen"><header class="hud"><button id="btnSettingsBack" class="icon-btn">←</button><div class="hud-level" data-i18n="settings"></div><span></span></header><div class="panel settings-panel"><label class="toggle"><span data-i18n="sound"></span><input type="checkbox" id="setSound"></label><label class="toggle"><span data-i18n="music"></span><input type="checkbox" id="setMusic"></label><label class="toggle"><span data-i18n="haptics"></span><input type="checkbox" id="setHaptics"></label><label class="toggle"><span data-i18n="colorblind"></span><input type="checkbox" id="setCb"></label><label class="toggle"><span data-i18n="reduceMotion"></span><input type="checkbox" id="setReduceMotion"></label><label class="toggle"><span data-i18n="tips"></span><input type="checkbox" id="setTips"></label><label class="toggle"><span data-i18n="language"></span><select id="langSelect"></select></label><button id="btnResetProgress" class="btn danger" data-i18n="resetProgress"></button><button id="btnPrivacy" class="btn small" data-i18n="privacy"></button><div id="verLabel" class="muted center"></div></div></section>
<section id="help" class="screen"><header class="hud"><button id="btnHelpBack" class="icon-btn">←</button><div class="hud-level" data-i18n="help"></div><span></span></header><div class="panel help-panel"><p data-i18n="how1"></p><p data-i18n="how2"></p><p data-i18n="how3"></p><p data-i18n="how4"></p><p class="goal" data-i18n="goal"></p></div></section>
<section id="shop" class="screen"><header class="hud"><button id="btnShopBack" class="icon-btn">←</button><div class="hud-level" data-i18n="shop"></div><span></span></header><div class="panel"><div id="shopItems" class="shopitems"></div><button id="btnRestore" class="btn small" data-i18n="restore"></button></div></section>
<div id="toast" class="toast"></div></div><script type="module" src="js/main.js"></script></body></html>
